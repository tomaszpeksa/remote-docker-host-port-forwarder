name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go aqua:golangci/golangci-lint aqua:jqlang/jq
          mise exec -- scripts/check-tools.sh go gofmt golangci-lint jq

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Verify scoped tools and ordinary execution
        run: bash scripts/test-mise.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    strategy:
      matrix:
        go-version: ['1.27.2']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go aqua:jqlang/jq
          mise exec -- scripts/check-tools.sh go gofmt jq

      - name: Download dependencies
        run: go mod download

      - name: List unit-check tests and record source
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          command -v jq
          mkdir -p test-evidence
          { git rev-parse HEAD HEAD^{tree}; go version; } > test-evidence/source.txt
          go test -json -list . ./... > test-evidence/list.jsonl 2> test-evidence/list.stderr

      - name: Run unit tests
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          set +e
          go test -json -count=1 -race -timeout=5m -coverpkg=./cmd/...,./internal/... -coverprofile=coverage.txt -covermode=atomic ./... 2> test-evidence/tests.stderr | tee test-evidence/tests.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/tests.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          exit "${status[1]}"

      - name: Inventory actual test outcomes
        if: always()
        run: |
          mkdir -p test-evidence
          touch test-evidence/list.jsonl test-evidence/tests.jsonl
          jq -s --slurpfile listed test-evidence/list.jsonl --arg selector '.' \
            --arg exit "$(cat test-evidence/tests.exit 2>/dev/null || echo unrun)" \
            -f .github/test-inventory.jq test-evidence/tests.jsonl > test-evidence/inventory.json

      - name: Upload coverage and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.go-version }}
          path: |
            coverage.txt
            test-evidence/

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go
          mise exec -- scripts/check-tools.sh go gofmt

      - name: Build for linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o rdhpf-linux-amd64 ./cmd/rdhpf

      - name: Verify binary
        run: |
          file rdhpf-linux-amd64
          ./rdhpf-linux-amd64 version

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdhpf-linux-amd64
          path: rdhpf-linux-amd64
