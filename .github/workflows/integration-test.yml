name: Integration Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration-test.yml'
  workflow_dispatch:
    inputs:
      ssh_host:
        description: 'SSH test host (optional, uses localhost if not provided)'
        required: false
        default: 'localhost'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    # Share the accepted 60m ceiling across watchdog, stream and isolation proof.
    # All leaf deadlines, production 10/30/60 and full Make stability are unchanged.
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
      RDHPF_HOSTED_RECOVERY: '1'
      RDHPF_HOSTED_TRUST: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go aqua:jqlang/jq core:python
          mise exec -- scripts/check-tools.sh go gofmt jq python3

      - name: List integration tests and record planned phases
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          command -v jq
          mkdir -p test-evidence
          {
            git rev-parse HEAD HEAD^{tree}
            go version
            uname -a
            ssh_executable=$(command -v ssh)
            printf 'ssh_executable=%s\n' "$ssh_executable"
            printf 'ssh_resolved=%s\n' "$(readlink -f "$ssh_executable")"
            sha256sum "$ssh_executable"
            ssh -V 2>&1
          } > test-evidence/source.txt
          printf '%s\n' 'ssh|TestSSHMaster' 'stream|TestDockerEventsStream' 'one-port|^TestManager_ContainerWithOnePort$' 'all|.' 'trust-internal|Test(ManagerMissingMuxTrust|LabelMissingMuxTrust|ControlRequestTrust|OwnedAssociationCheckFallback|RemoteDockerPingOwnedEvent)' 'discovery-owned|^TestManagerDiscoveryOwned' 'isolation-owned|^Test(OwnedCLIIsolation|OwnedMasterProcessIsolation|MasterPrivatePathNativeBind)$' > test-evidence/plan.txt
          printf '%s\n' 'stream-owned|^TestManagerStreamOwnedTermination$' >> test-evidence/plan.txt
          printf '%s\n' 'watchdog-cold|^TestWatchdogOwnedColdPull$' 'watchdog-warm|^TestWatchdogOwnedWarmProcessing$' 'watchdog-cli|^TestWatchdogOwnedCLISilentStream$' 'watchdog-blocked|^TestWatchdogOwned(BlockedWork|PullAllowance)$' >> test-evidence/plan.txt
          go test -tags=rdhpf_integration -json -list . ./tests/integration/ ./internal/manager ./internal/docker ./internal/ssh ./cmd/rdhpf ./internal/testutil/sshfixture > test-evidence/list.jsonl 2> test-evidence/list.stderr

      - name: Install Docker
        run: |
          # Docker should already be available on ubuntu-latest
          docker --version

      - name: Provision owned SSH fixture and trusted public key
        run: |
          test -z "${DOCKER_API_VERSION:-}" # Preserve API negotiation.
          bash scripts/itest-up.sh 2>&1 | tee test-evidence/fixture-build.log
          cp .itests/provenance.txt test-evidence/fixture-provenance.txt
          cp .itests/host-key.pub test-evidence/host-key.pub
          id=$(cat .itests/container-id)
          docker exec "$id" sh -ec 'sha256sum /etc/apk/keys/*; apk policy openssh-server docker-cli; /usr/sbin/sshd -T' > test-evidence/fixture-policy.txt
          # Actual account config is used by real application SSH. Save exact
          # previous bytes privately; never upload this backup or private keys.
          test "$GITHUB_ACTIONS" = true
          test "$HOME" = "$(getent passwd "$(id -un)" | cut -d: -f6)"
          mkdir -p "$HOME/.ssh" "$RUNNER_TEMP/s07-ssh-backup"
          test ! -e "$HOME/.ssh/id_rdhpf_test"
          test ! -e "$HOME/.ssh/id_rdhpf_test.pub"
          for file in config known_hosts; do
            if [ -e "$HOME/.ssh/$file" ]; then cp -p "$HOME/.ssh/$file" "$RUNNER_TEMP/s07-ssh-backup/$file"; fi
          done
          touch "$RUNNER_TEMP/s07-ssh-backup/owned"
          cp .itests/home/.ssh/id_ed25519 "$HOME/.ssh/id_rdhpf_test"
          cp .itests/home/.ssh/id_ed25519.pub "$HOME/.ssh/id_rdhpf_test.pub"
          cp .itests/home/.ssh/config "$HOME/.ssh/config"
          cp .itests/home/.ssh/known_hosts "$HOME/.ssh/known_hosts"

      - name: Owned watchdog cold pull before image warmup
        timeout-minutes: 4
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          mkdir -p test-evidence/bin
          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            pwd
            git rev-parse HEAD HEAD^{tree}
            git status --porcelain=v1 --untracked-files=all
            git ls-files --others --exclude-standard
            git diff --exit-code
            git diff --cached --exit-code
          } > test-evidence/watchdog-cli-prebuild.txt
          go build -o "$PWD/test-evidence/bin/rdhpf" ./cmd/rdhpf
          go version -m test-evidence/bin/rdhpf > test-evidence/watchdog-cli-build.txt
          sha256sum test-evidence/bin/rdhpf >> test-evidence/watchdog-cli-build.txt
          set +e
          go test -tags=rdhpf_integration -json -count=1 -p 1 -timeout=3m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/watchdog-cold.coverage -run '^TestWatchdogOwnedColdPull$' ./internal/manager 2> test-evidence/watchdog-cold.stderr | tee test-evidence/watchdog-cold.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/watchdog-cold.exit
          test "${status[0]}" -eq 0 && test "${status[1]}" -eq 0

      - name: Warm unchanged production ping image after cold proof
        run: |
          id=$(cat .itests/container-id)
          docker exec "$id" docker pull alpine:latest > test-evidence/ping-image-pull.txt
          docker exec "$id" docker image inspect alpine:latest --format '{{json .RepoDigests}}' > test-evidence/ping-image-digests.txt

      - name: Owned watchdog failure accounting control
        timeout-minutes: 7
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: bash scripts/itest-watchdog-failure-accounting.sh

      - name: Owned watchdog warm processing
        timeout-minutes: 5
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          set +e
          go test -tags=rdhpf_integration -json -count=1 -p 1 -timeout=4m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/watchdog-warm.coverage -run '^TestWatchdogOwnedWarmProcessing$' ./internal/manager 2> test-evidence/watchdog-warm.stderr | tee test-evidence/watchdog-warm.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/watchdog-warm.exit
          test "${status[0]}" -eq 0 && test "${status[1]}" -eq 0

      - name: Owned watchdog delivered CLI silence
        timeout-minutes: 4
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          export RDHPF_WATCHDOG_BINARY="$PWD/test-evidence/bin/rdhpf"
          set +e
          go test -tags=rdhpf_integration -json -count=1 -p 1 -timeout=3m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/watchdog-cli.coverage -run '^TestWatchdogOwnedCLISilentStream$' ./cmd/rdhpf 2> test-evidence/watchdog-cli.stderr | tee test-evidence/watchdog-cli.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/watchdog-cli.exit
          test "${status[0]}" -eq 0 && test "${status[1]}" -eq 0

      - name: Owned watchdog blocked commands and pull allowance
        timeout-minutes: 7
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          set +e
          go test -tags=rdhpf_integration -json -count=1 -p 1 -timeout=6m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/watchdog-blocked.coverage -run '^TestWatchdogOwned(BlockedWork|PullAllowance)$' ./internal/manager 2> test-evidence/watchdog-blocked.stderr | tee test-evidence/watchdog-blocked.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/watchdog-blocked.exit
          test "${status[0]}" -eq 0 && test "${status[1]}" -eq 0

      - name: Require owned watchdog passes
        run: |
          jq -e -s --rawfile required .github/required-watchdog-tests.txt '
            . as $events | ($required | split("\n") | map(select(length > 0))) as $names |
            ($names | length) == 6 and all($names[]; . as $name |
              (if $name == "TestWatchdogOwnedCLISilentStream" then "cmd/rdhpf" else "internal/manager" end) as $suffix |
              [$events[] | select(.Test == $name and .Package == ("github.com/tomaszpeksa/remote-docker-host-port-forwarder/" + $suffix))] as $matches |
              ($matches | last | .Action) == "pass") and
            all($events[] | select(.Action == "run"); . as $run |
              any($events[]; .Package == $run.Package and .Test == $run.Test and (.Action == "pass" or .Action == "fail" or .Action == "skip"))) and
            (any($events[]; .Action == "fail") | not)
          ' test-evidence/watchdog-{cold,warm,cli,blocked}.jsonl

      - name: Source-bound watchdog controls
        timeout-minutes: 5
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
          RDHPF_HOSTED_TRUST: ''
          RDHPF_HOSTED_RECOVERY: ''
        run: bash scripts/itest-watchdog-mutations.sh

      - name: Phase 1 - Run SSH Master integration tests
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 1: SSH Master Tests ==="
          echo "Running SSH ControlMaster tests (8 tests, ~30s)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"

          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=3m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/ssh.coverage -run 'TestSSHMaster' ./tests/integration/ 2> test-evidence/ssh.stderr | tee test-evidence/ssh.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/ssh.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi

          echo "✓ Phase 1 complete: SSH Master tests passed"

      - name: Phase 2 - Run stream persistence tests
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 2: Stream Persistence Tests ==="
          echo "Testing docker events stream stays open (critical bug detection)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"

          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=5m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/stream.coverage -run 'TestDockerEventsStream' ./tests/integration/ 2> test-evidence/stream.stderr | tee test-evidence/stream.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/stream.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi

          echo "✓ Phase 2 complete: Stream persistence tests passed"

      - name: Phase 2b - Run E2E container lifecycle test
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 2b: E2E Container Test ==="
          echo "Running single-container port forwarding test (~45s)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"

          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=3m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/one-port.coverage -run '^TestManager_ContainerWithOnePort$' ./tests/integration/ 2> test-evidence/one-port.stderr | tee test-evidence/one-port.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/one-port.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi

          echo "✓ Phase 2b complete: E2E container test passed"

      - name: Phase 3 - Run all integration tests
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 3: All Integration Tests ==="
          echo "Running complete integration test suite (15m test budget)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"

          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=15m -p 1 -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/all.coverage ./tests/integration/... 2> test-evidence/all.stderr | tee test-evidence/all.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/all.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi

          # A missing selector must not silently turn mandatory hosted proof into skips.
          jq -e -s 'any(.[]; .Action == "pass" and .Test == "TestConnectionLossRecovery") and any(.[]; .Action == "pass" and .Test == "TestOwnedChildHardLossRecovery") and any(.[]; .Action == "pass" and .Test == "TestManagerPreexistingContainerIdentity")' test-evidence/all.jsonl || exit "$?"
          echo "✓ Phase 3 complete: All integration tests passed"

      - name: Private command trust and conditional control requests
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=3m -p 1 -run 'Test(ManagerMissingMuxTrust|LabelMissingMuxTrust|ControlRequestTrust|OwnedAssociationCheckFallback|RemoteDockerPingOwnedEvent)' ./internal/manager ./internal/docker ./internal/ssh 2> test-evidence/trust-internal.stderr | tee test-evidence/trust-internal.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/trust-internal.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi
          jq -e -s --rawfile required .github/required-trust-tests.txt '
            . as $events | ($required | split("\n") | map(select(length > 0))) |
            all(.[]; . as $name | any($events[]; .Action == "pass" and .Test == $name))
          ' test-evidence/all.jsonl test-evidence/trust-internal.jsonl

      - name: Owned discovery repair
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=5m -p 1 -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/discovery-owned.coverage -run '^TestManagerDiscoveryOwned' ./internal/manager 2> test-evidence/discovery-owned.stderr | tee test-evidence/discovery-owned.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/discovery-owned.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi
          jq -e -s --rawfile required .github/required-discovery-tests.txt '
            . as $events | ($required | split("\n") | map(select(length > 0))) as $names |
            ($names | length) == 4 and all($names[]; . as $name | any($events[]; .Action == "pass" and .Test == $name))
          ' test-evidence/discovery-owned.jsonl

      - name: Owned finite event stream termination
        timeout-minutes: 6
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=5m -p 1 -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/stream-owned.coverage -run '^TestManagerStreamOwnedTermination$' ./internal/manager 2> test-evidence/stream-owned.stderr | tee test-evidence/stream-owned.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/stream-owned.exit
          test "${status[0]}" -eq 0 && test "${status[1]}" -eq 0

      - name: Require owned stream passes
        run: |
          jq -e -s --rawfile required .github/required-stream-tests.txt '
            . as $events | ($required | split("\n") | map(select(length > 0))) as $names |
            ($names | length) == 2 and all($names[]; . as $name |
              [$events[] | select(.Test == $name and .Package == "github.com/tomaszpeksa/remote-docker-host-port-forwarder/internal/manager")] as $matches |
              ($matches | last | .Action) == "pass") and
            all($events[] | select(.Action == "run"); . as $run |
              any($events[]; .Package == $run.Package and .Test == $run.Test and (.Action == "pass" or .Action == "fail" or .Action == "skip"))) and
            (any($events[]; .Action == "fail") | not)
          ' test-evidence/stream-owned.jsonl

      - name: Source-bound stream controls
        timeout-minutes: 3
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
          RDHPF_HOSTED_TRUST: ''
          RDHPF_HOSTED_RECOVERY: ''
        run: |
          bash scripts/itest-stream-mutations.sh
          test "$(cat test-evidence/stream-controls/result.txt)" = 'Named stream assertion reds and exact restored greens observed: no-pacing no-processing no-retirement no-direct-wait-join no-wait-delay no-watcher-join'

      - name: Source-bound discovery controls
        timeout-minutes: 5
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: bash scripts/itest-discovery-mutations.sh

      - name: Source-bound trust red controls
        timeout-minutes: 3
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: bash scripts/itest-trust-mutations.sh

      - name: Source-bound container identity control
        timeout-minutes: 3
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: bash scripts/itest-identity-mutation.sh

      - name: Owned process isolation
        timeout-minutes: 5
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
          RDHPF_HOSTED_ISOLATION: '1'
        run: |
          export RDHPF_ISOLATION_BINARY="$PWD/test-evidence/rdhpf-isolation"
          export RDHPF_ISOLATION_EVIDENCE="$PWD/test-evidence/isolation-runtime"
          {
            pwd -P
            git rev-parse HEAD HEAD^{tree}
            git status --porcelain=v1 --untracked-files=all
            git diff --exit-code
            git diff --cached --exit-code
          } > test-evidence/isolation-prebuild.txt
          go build -o "$RDHPF_ISOLATION_BINARY" ./cmd/rdhpf
          go version -m "$RDHPF_ISOLATION_BINARY" > test-evidence/isolation-binary.txt
          sha256sum "$RDHPF_ISOLATION_BINARY" >> test-evidence/isolation-binary.txt
          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=3m -p 1 -run '^Test(OwnedCLIIsolation|OwnedMasterProcessIsolation|MasterPrivatePathNativeBind)$' ./tests/integration ./internal/ssh 2> test-evidence/isolation-owned.stderr | tee test-evidence/isolation-owned.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/isolation-owned.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi
          bash scripts/check-isolation-evidence.sh test-evidence/isolation-owned.jsonl

      - name: Source-bound isolation controls
        timeout-minutes: 8
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
          RDHPF_HOSTED_ISOLATION: '1'
        run: bash scripts/itest-isolation-mutations.sh

      - name: Inventory executed, excluded and unrun tests
        if: always()
        run: |
          mkdir -p test-evidence
          if [ ! -f test-evidence/plan.txt ]; then
            echo 'Test planning did not run; no scenario execution evidence.' > test-evidence/unrun.txt
            exit 0
          fi
          touch test-evidence/list.jsonl
          while IFS='|' read -r phase selector; do
            touch "test-evidence/$phase.jsonl"
            jq -s --slurpfile listed test-evidence/list.jsonl --arg selector "$selector" \
              --arg exit "$(cat "test-evidence/$phase.exit" 2>/dev/null || echo unrun)" \
              -f .github/test-inventory.jq "test-evidence/$phase.jsonl" > "test-evidence/$phase.inventory.json"
          done < test-evidence/plan.txt

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a

          echo "=== SSH Container Logs ==="
          docker logs rdhpf-sshd-stub || true

          echo "=== Network connections ==="
          sudo netstat -tlnp || ss -tlnp || true

      - name: Cleanup test environment
        if: always()
        run: |
          # Restore exact disposable-account config before deleting owned keys.
          if [ -f "$RUNNER_TEMP/s07-ssh-backup/owned" ]; then
            for file in config known_hosts; do
              if [ -f "$RUNNER_TEMP/s07-ssh-backup/$file" ]; then
                cp -p "$RUNNER_TEMP/s07-ssh-backup/$file" "$HOME/.ssh/$file"
              else
                rm -f "$HOME/.ssh/$file"
              fi
            done
            rm -f "$HOME/.ssh/id_rdhpf_test" "$HOME/.ssh/id_rdhpf_test.pub"
          fi
          set +e
          bash scripts/itest-down.sh > test-evidence/cleanup.stdout 2> test-evidence/cleanup.stderr
          status=$?
          printf '%s\n' "$status" > test-evidence/cleanup.exit
          set -e
          test "$status" -eq 0
          test ! -e .itests

      - name: Documented Make fixture lifecycle
        timeout-minutes: 12
        env:
          RDHPF_HOSTED_TRUST: ''
          RDHPF_HOSTED_RECOVERY: ''
        run: |
          # Separate ordinary local-mode proof on this disposable daemon, after
          # the actual-account fixture above has been fully restored/removed.
          trap 'make itest-down' EXIT
          make itest-up > test-evidence/make-up.stdout 2> test-evidence/make-up.stderr
          set +e
          make itest GOTEST_FLAGS='-json -run ^TestManager_ContainerWithOnePort$' 2> test-evidence/make-itest.stderr | tee test-evidence/make-itest.stdout
          status=("${PIPESTATUS[@]}")
          printf 'make=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/make-itest.exit
          set -e
          test "${status[0]}" -eq 0; test "${status[1]}" -eq 0
          jq -Rc 'fromjson? | select(.Action != null)' test-evidence/make-itest.stdout > test-evidence/make-itest.jsonl
          jq -e -s 'any(.[]; .Action == "pass" and .Test == "TestManager_ContainerWithOnePort")' test-evidence/make-itest.jsonl
          make itest-down > test-evidence/make-down.stdout 2> test-evidence/make-down.stderr
          test ! -e .itests; test ! -e .itests-cleanup-owner
          make itest-up > test-evidence/make-second-up.stdout 2> test-evidence/make-second-up.stderr
          set +e
          make itest-stability GOTEST_FLAGS=-json 2> test-evidence/make-stability.stderr | tee test-evidence/make-stability.stdout
          status=("${PIPESTATUS[@]}")
          printf 'make=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/make-stability.exit
          set -e
          test "${status[0]}" -eq 0; test "${status[1]}" -eq 0
          jq -Rc 'fromjson? | select(.Action != null)' test-evidence/make-stability.stdout > test-evidence/make-stability.jsonl
          jq -e -s 'any(.[]; .Action == "pass" and .Test == "TestManager_LongRunningTunnelStability") and any(.[]; .Action == "pass" and .Test == "TestManager_TunnelStabilityUnderLoad")' test-evidence/make-stability.jsonl
          make itest-down > test-evidence/make-second-down.stdout 2> test-evidence/make-second-down.stderr
          test ! -e .itests; test ! -e .itests-cleanup-owner
          printf 'Two Make up/test/down cycles completed with joined runtime HOME retirement.\n' > test-evidence/make-lifecycle.result

      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-evidence
          path: test-evidence/
          if-no-files-found: error
