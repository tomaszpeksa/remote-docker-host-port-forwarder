name: Integration Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration-test.yml'
  workflow_dispatch:
    inputs:
      ssh_host:
        description: 'SSH test host (optional, uses localhost if not provided)'
        required: false
        default: 'localhost'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: List integration tests and record planned phases
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          command -v jq
          mkdir -p test-evidence
          { git rev-parse HEAD HEAD^{tree}; go version; } > test-evidence/source.txt
          printf '%s\n' 'ssh|TestSSHMaster' 'stream|TestDockerEventsStream' 'one-port|^TestManager_ContainerWithOnePort$' 'all|.' > test-evidence/plan.txt
          go test -tags=rdhpf_integration -json -list . ./tests/integration/ > test-evidence/list.jsonl 2> test-evidence/list.stderr

      - name: Install Docker
        run: |
          # Docker should already be available on ubuntu-latest
          docker --version

      - name: Build SSH test container with Docker-in-Docker
        run: |
          echo "Building sshd-stub-dind (Docker-in-Docker) image..."
          docker build --no-cache -t rdhpf-sshd-stub \
            -f docker/sshd-stub-dind/Dockerfile \
            docker/sshd-stub-dind/
      
      - name: Generate SSH test key
        run: |
          echo "Generating SSH key for tests..."
          mkdir -p $HOME/.ssh
          ssh-keygen -t ed25519 -f $HOME/.ssh/id_rdhpf_test -N "" -C "rdhpf-ci-test"
          chmod 600 $HOME/.ssh/id_rdhpf_test
          chmod 644 $HOME/.ssh/id_rdhpf_test.pub
      
      - name: Start SSH test container with Docker socket mount
        run: |
          echo "Starting SSH container with Docker socket mount..."
          docker run -d --name rdhpf-sshd-stub \
            -p 2222:22 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --label rdhpf.test-infrastructure=true \
            rdhpf-sshd-stub
          
          echo "Waiting for Docker CLI access via socket..."
          sleep 2
          
          echo "Verifying Docker access..."
          if ! docker exec rdhpf-sshd-stub docker info >/dev/null 2>&1; then
            echo "ERROR: Docker socket access failed"
            docker logs rdhpf-sshd-stub
            exit 1
          fi
          
          echo "✓ Docker CLI ready (using host daemon via socket mount)"
          
          echo "Waiting for SSH server to be ready..."
          sleep 2
          
          echo "Configuring SSH key authentication in container..."
          docker cp $HOME/.ssh/id_rdhpf_test.pub rdhpf-sshd-stub:/tmp/pubkey
          docker exec rdhpf-sshd-stub sh -c "
            mv /tmp/pubkey /home/testuser/.ssh/authorized_keys && \
            chmod 600 /home/testuser/.ssh/authorized_keys && \
            chown testuser:testuser /home/testuser/.ssh/authorized_keys
          "
          
          echo "Testing SSH connection..."
          ssh -i $HOME/.ssh/id_rdhpf_test \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -p 2222 testuser@localhost echo "✓ SSH connection successful"
          
          echo "Testing Docker access over SSH..."
          ssh -i $HOME/.ssh/id_rdhpf_test \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR \
            -p 2222 testuser@localhost docker info
          
          echo "✓ SSH and Docker both working"

      - name: Phase 1 - Run SSH Master integration tests
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 1: SSH Master Tests ==="
          echo "Running SSH ControlMaster tests (8 tests, ~30s)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"
          
          # Configure SSH for tests
          mkdir -p $HOME/.ssh
          cat > $HOME/.ssh/config <<EOF
          Host localhost
            Port 2222
            IdentityFile $HOME/.ssh/id_rdhpf_test
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 $HOME/.ssh/config
          
          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=3m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/ssh.coverage -run 'TestSSHMaster' ./tests/integration/ 2> test-evidence/ssh.stderr | tee test-evidence/ssh.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/ssh.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi
          
          echo "✓ Phase 1 complete: SSH Master tests passed"
      
      - name: Phase 2 - Run stream persistence tests
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 2: Stream Persistence Tests ==="
          echo "Testing docker events stream stays open (critical bug detection)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"
          
          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=5m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/stream.coverage -run 'TestDockerEventsStream' ./tests/integration/ 2> test-evidence/stream.stderr | tee test-evidence/stream.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/stream.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi
          
          echo "✓ Phase 2 complete: Stream persistence tests passed"
      
      - name: Phase 2b - Run E2E container lifecycle test
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 2b: E2E Container Test ==="
          echo "Running single-container port forwarding test (~45s)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"
          
          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=3m -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/one-port.coverage -run '^TestManager_ContainerWithOnePort$' ./tests/integration/ 2> test-evidence/one-port.stderr | tee test-evidence/one-port.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/one-port.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi
          
          echo "✓ Phase 2b complete: E2E container test passed"
      
      - name: Phase 3 - Run all integration tests
        env:
          SSH_TEST_HOST: ssh://testuser@localhost:2222
        run: |
          echo "=== Phase 3: All Integration Tests ==="
          echo "Running complete integration test suite (~3-5m)"
          echo "SSH_TEST_HOST=$SSH_TEST_HOST"

          set +e
          go test -tags=rdhpf_integration -json -count=1 -timeout=10m -p 1 -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=test-evidence/all.coverage ./tests/integration/... 2> test-evidence/all.stderr | tee test-evidence/all.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/all.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          if [ "${status[1]}" -ne 0 ]; then exit "${status[1]}"; fi
          
          echo "✓ Phase 3 complete: All integration tests passed"

      - name: Inventory executed, excluded and unrun tests
        if: always()
        run: |
          mkdir -p test-evidence
          if [ ! -f test-evidence/plan.txt ]; then
            echo 'Test planning did not run; no scenario execution evidence.' > test-evidence/unrun.txt
            exit 0
          fi
          touch test-evidence/list.jsonl
          while IFS='|' read -r phase selector; do
            touch "test-evidence/$phase.jsonl"
            jq -s --slurpfile listed test-evidence/list.jsonl --arg selector "$selector" \
              --arg exit "$(cat "test-evidence/$phase.exit" 2>/dev/null || echo unrun)" \
              -f .github/test-inventory.jq "test-evidence/$phase.jsonl" > "test-evidence/$phase.inventory.json"
          done < test-evidence/plan.txt

      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-evidence
          path: test-evidence/
          if-no-files-found: error

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          
          echo "=== SSH Container Logs ==="
          docker logs rdhpf-sshd-stub || true
          
          echo "=== Network connections ==="
          sudo netstat -tlnp || ss -tlnp || true

      - name: Cleanup test environment
        if: always()
        run: |
          # Stop and remove SSH test container
          docker stop rdhpf-sshd-stub || true
          docker rm rdhpf-sshd-stub || true
          
          # Clean up SSH keys
          rm -f $HOME/.ssh/id_rdhpf_test $HOME/.ssh/id_rdhpf_test.pub
          rm -f $HOME/.ssh/config