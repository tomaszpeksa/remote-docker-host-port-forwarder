name: Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-diagnostic:
    name: S01 paired traffic diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - name: One base and changed experiment
        run: timeout 600s bash scripts/s01-diagnostic.sh
      - name: Remove owned experiment resources
        if: always()
        run: |
          docker ps -aq --filter "label=rdhpf.s01-diagnostic=s01-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | xargs -r docker rm -f || true
          docker ps -aq --filter label=rdhpf.health-check=true | xargs -r docker rm -f || true
          rm -f "$RUNNER_TEMP/s01-diagnostic-work/id_test" "$RUNNER_TEMP/s01-diagnostic-work/id_test.pub"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-paired-diagnostic
          path: ${{ runner.temp }}/s01-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
