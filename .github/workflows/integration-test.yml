name: Integration Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration-test.yml'
  workflow_dispatch:
    inputs:
      ssh_host:
        description: 'SSH test host (optional, uses localhost if not provided)'
        required: false
        default: 'localhost'
  schedule:
    - cron: '0 2 * * *'

jobs:
  integration-test:
    name: Bounded traffic diagnostic (not for merge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      SSH_TEST_HOST: ssh://testuser@localhost:2222
      TRAFFIC_DIAGNOSTIC_OWNER: traffic-${{ github.run_id }}-${{ github.run_attempt }}
      TRAFFIC_DIAGNOSTIC_FIXTURE: rdhpf-sshd-stub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true

      - name: Record source and environment
        run: bash scripts/traffic-diagnostic.sh prepare

      - name: Build SSH test container
        run: |
          set -o pipefail
          timeout -k 1s 120s docker build --no-cache -t rdhpf-sshd-stub \
            -f docker/sshd-stub-dind/Dockerfile docker/sshd-stub-dind/ \
            2>&1 | tee "$RUNNER_TEMP/traffic-diagnostic-evidence/image-build.log"

      - name: Generate SSH test key
        run: |
          mkdir -p "$HOME/.ssh"
          timeout -k 1s 3s ssh-keygen -t ed25519 -f "$HOME/.ssh/id_rdhpf_test" -N "" -C "rdhpf-ci-test"
          chmod 600 "$HOME/.ssh/id_rdhpf_test"
          chmod 644 "$HOME/.ssh/id_rdhpf_test.pub"

      - name: Start SSH test container with Docker socket mount
        run: |
          timeout -k 1s 3s docker run -d --name "$TRAFFIC_DIAGNOSTIC_FIXTURE" \
            -p 2222:22 -v /var/run/docker.sock:/var/run/docker.sock \
            --label rdhpf.test-infrastructure=true \
            --label "rdhpf.traffic-diagnostic=$TRAFFIC_DIAGNOSTIC_OWNER" \
            rdhpf-sshd-stub

          # Preserve the existing two infrastructure waits; no app exists yet.
          sleep 2
          timeout -k 1s 3s docker exec "$TRAFFIC_DIAGNOSTIC_FIXTURE" docker info
          sleep 2
          timeout -k 1s 3s docker cp "$HOME/.ssh/id_rdhpf_test.pub" "$TRAFFIC_DIAGNOSTIC_FIXTURE:/tmp/pubkey"
          timeout -k 1s 3s docker exec "$TRAFFIC_DIAGNOSTIC_FIXTURE" sh -c '
            mv /tmp/pubkey /home/testuser/.ssh/authorized_keys &&
            chmod 600 /home/testuser/.ssh/authorized_keys &&
            chown testuser:testuser /home/testuser/.ssh/authorized_keys'

          timeout -k 1s 3s ssh -i "$HOME/.ssh/id_rdhpf_test" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR -p 2222 testuser@localhost echo 'SSH connection successful'
          timeout -k 1s 3s ssh -i "$HOME/.ssh/id_rdhpf_test" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR -p 2222 testuser@localhost docker info

      - name: Phase 1 - Run SSH Master integration tests once
        run: |
          cat > "$HOME/.ssh/config" <<EOF
          Host localhost
            Port 2222
            IdentityFile $HOME/.ssh/id_rdhpf_test
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF
          chmod 600 "$HOME/.ssh/config"
          bash scripts/traffic-diagnostic.sh phase ssh 3m 185s 'TestSSHMaster' 8

      - name: Phase 2 - Run stream persistence tests once
        run: bash scripts/traffic-diagnostic.sh phase stream 5m 305s 'TestDockerEventsStream' 2

      - name: Phase 2b - Run one-port scenario once
        run: bash scripts/traffic-diagnostic.sh phase one-port 3m 185s '^TestManager_ContainerWithOnePort$' 1

      - name: Collect evidence and clean owned resources
        if: always()
        run: bash scripts/traffic-diagnostic.sh collect-cleanup

      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/traffic-diagnostic-evidence/
          if-no-files-found: error
