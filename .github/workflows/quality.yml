name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go aqua:golangci/golangci-lint aqua:jqlang/jq
          mise exec -- scripts/check-tools.sh go golangci-lint jq

      - name: Run gosec security scanner
        run: scripts/security.sh --hosted gosec-report.json ./cmd/... ./internal/...

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: |
            gosec-report.json
            gosec-report.json.*

      - name: Print security summary
        if: always()
        run: jq '.Issues // []' gosec-report.json

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go aqua:jqlang/jq
          mise exec -- scripts/check-tools.sh go gofmt jq

      - name: List unit-check tests and record source
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          command -v jq
          mkdir -p test-evidence
          { git rev-parse HEAD HEAD^{tree}; go version; } > test-evidence/source.txt
          go test -json -list . ./... > test-evidence/list.jsonl 2> test-evidence/list.stderr

      - name: Run tests with coverage
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          set +e
          go test -json -count=1 -race -timeout=5m -coverpkg=./cmd/...,./internal/... -coverprofile=coverage.out -covermode=atomic ./... 2> test-evidence/tests.stderr | tee test-evidence/tests.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/tests.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          exit "${status[1]}"

      - name: Inventory actual test outcomes
        if: always()
        run: |
          mkdir -p test-evidence
          touch test-evidence/list.jsonl test-evidence/tests.jsonl
          jq -s --slurpfile listed test-evidence/list.jsonl --arg selector '.' \
            --arg exit "$(cat test-evidence/tests.exit 2>/dev/null || echo unrun)" \
            -f .github/test-inventory.jq test-evidence/tests.jsonl > test-evidence/inventory.json

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Calculate coverage percentage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Test coverage: ${COVERAGE}%"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            test-evidence/

      - name: Upload to Codecov (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          version: v11.3.1
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.COVERAGE }}';
            const comment = `## 📊 Test Coverage Report
            
            Current coverage: **${coverage}%**
            
            [View detailed report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go go:golang.org/x/vuln/cmd/govulncheck go:github.com/psampaz/go-mod-outdated
          mise exec -- scripts/check-tools.sh go govulncheck go-mod-outdated

      - name: Check for outdated dependencies
        run: |
          go list -u -m -json all | go-mod-outdated -update -direct

      - name: Run go mod verify
        run: go mod verify

      - name: Check for vulnerabilities
        run: |
          govulncheck ./...

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "Dependencies are not tidy. Run 'go mod tidy'." && exit 1)
