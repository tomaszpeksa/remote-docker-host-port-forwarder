name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec security scanner
        run: gosec -fmt=json -out=gosec-report.json -severity medium -confidence medium ./cmd/... ./internal/...

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: gosec-report.json

      - name: Print security summary
        run: gosec -fmt=text -severity medium -confidence medium ./cmd/... ./internal/...

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: List unit-check tests and record source
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          command -v jq
          mkdir -p test-evidence
          { git rev-parse HEAD HEAD^{tree}; go version; } > test-evidence/source.txt
          go test -json -list . ./... > test-evidence/list.jsonl 2> test-evidence/list.stderr

      - name: Run tests with coverage
        env:
          SSH_TEST_HOST: ''
          SSH_TEST_KEY_PATH: ''
        run: |
          set +e
          go test -json -count=1 -race -timeout=5m -coverpkg=./cmd/...,./internal/... -coverprofile=coverage.out -covermode=atomic ./... 2> test-evidence/tests.stderr | tee test-evidence/tests.jsonl
          status=("${PIPESTATUS[@]}")
          printf 'go=%s tee=%s\n' "${status[0]}" "${status[1]}" > test-evidence/tests.exit
          if [ "${status[0]}" -ne 0 ]; then exit "${status[0]}"; fi
          exit "${status[1]}"

      - name: Inventory actual test outcomes
        if: always()
        run: |
          mkdir -p test-evidence
          touch test-evidence/list.jsonl test-evidence/tests.jsonl
          jq -s --slurpfile listed test-evidence/list.jsonl --arg selector '.' \
            --arg exit "$(cat test-evidence/tests.exit 2>/dev/null || echo unrun)" \
            -f .github/test-inventory.jq test-evidence/tests.jsonl > test-evidence/inventory.json

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Calculate coverage percentage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Test coverage: ${COVERAGE}%"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            test-evidence/

      - name: Upload to Codecov (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.COVERAGE }}';
            const comment = `## 📊 Test Coverage Report
            
            Current coverage: **${coverage}%**
            
            [View detailed report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        continue-on-error: true

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Check for outdated dependencies
        run: |
          go list -u -m -json all | go run github.com/psampaz/go-mod-outdated@latest -update -direct

      - name: Run go mod verify
        run: go mod verify

      - name: Check for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "Dependencies are not tidy. Run 'go mod tidy'." && exit 1)