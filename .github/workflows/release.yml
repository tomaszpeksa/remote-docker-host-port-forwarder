name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build and Release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go aqua:jqlang/jq aqua:goreleaser/goreleaser
          mise exec -- scripts/check-tools.sh go gofmt jq goreleaser

      - name: Run tests before release
        run: go test -v ./...

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  build-manual:
    name: Manual Build (Fallback)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: mise exec -- bash --noprofile --norc -eo pipefail {0}
    env:
      GOTOOLCHAIN: local
      MISE_AUTO_INSTALL: "0"
    if: failure()
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Isolate managed tool paths
        shell: bash
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/s07-mise-data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/s07-mise-cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/s07-mise-state"
            echo "MISE_CONFIG_DIR=$RUNNER_TEMP/s07-mise-config"
            echo "MISE_GLOBAL_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/global.toml"
            echo "MISE_SYSTEM_CONFIG_FILE=$RUNNER_TEMP/s07-mise-config/system.toml"
            echo "GOCACHE=$RUNNER_TEMP/s07-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/s07-go-mod"
          } >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.10.8'
          sha256: 'c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428'
          install: false
          env: false
          export_path: false
          add_shims_to_path: false
          cache: false

      - name: Install locked project tools
        shell: bash
        run: |
          mkdir -p "$MISE_CONFIG_DIR"
          : > "$MISE_GLOBAL_CONFIG_FILE"
          : > "$MISE_SYSTEM_CONFIG_FILE"
          MISE_LOCKED_SCOPES=project mise install --locked core:go
          mise exec -- scripts/check-tools.sh go gofmt

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          OUTPUT_NAME=rdhpf-${{ matrix.os }}-${{ matrix.arch }}
          if [ "${{ matrix.os }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          CGO_ENABLED=0 go build \
            -ldflags "-X main.version=${VERSION} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${OUTPUT_NAME}" \
            ./cmd/rdhpf

          # Create compressed archive
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "${OUTPUT_NAME%.exe}.zip" "${OUTPUT_NAME}"
            ARCHIVE="${OUTPUT_NAME%.exe}.zip"
          else
            tar czf "${OUTPUT_NAME}.tar.gz" "${OUTPUT_NAME}"
            ARCHIVE="${OUTPUT_NAME}.tar.gz"
          fi

          # Generate SHA256 checksum
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV
          echo "CHECKSUM=${ARCHIVE}.sha256" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}

  create-release:
    name: Create GitHub Release
    needs: build-manual
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate checksums file
        run: |
          cd artifacts
          find . -name "*.sha256" -exec cat {} \; > ../checksums.txt
          cd ..

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          if [ -f "CHANGELOG.md" ]; then
            # Extract version section from CHANGELOG
            sed -n "/^## ${VERSION}/,/^## /p" CHANGELOG.md | sed '$d' > release_notes.txt
          else
            # Use git tag annotation or default message
            git tag -l --format='%(contents)' ${VERSION} > release_notes.txt
            if [ ! -s release_notes.txt ]; then
              echo "Release ${VERSION}" > release_notes.txt
            fi
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            checksums.txt
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-rc') || contains(steps.version.outputs.VERSION, '-beta') || contains(steps.version.outputs.VERSION, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
