version: "2"

# Security uses the pinned official golangci-lint release distribution.
# Its unchanged gosec engine/importer must not inherit ordinary lint policy.
run:
  tests: false
linters:
  default: none
  enable: [gosec]
  settings:
    gosec:
      severity: medium
      confidence: medium
  exclusions:
    generated: disable
    presets: []
    rules: []
    paths: []
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
