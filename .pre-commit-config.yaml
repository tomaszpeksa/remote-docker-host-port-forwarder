# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: project-tool-providers
        name: Check locked project tool providers
        entry: scripts/check-tools.sh go gofmt golangci-lint jq node python pre-commit markdownlint-cli2
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        args: [-s]
      - id: go-vet
        entry: go vet
        language: system
        args: [./...]
        pass_filenames: false
      - id: go-mod-tidy

  - repo: local
    hooks:
      - id: go-unit-tests
        name: Go Unit Tests
        entry: scripts/pre-commit.sh
        language: script
        files: \.go$
        pass_filenames: false
        description: Run fast unit tests

      - id: no-debug-prints
        name: Check for debug statements
        entry: 'grep -rn --include="*.go" -E "(fmt\.Print|log\.Print.*DEBUG|TODO|FIXME)" .'
        language: system
        pass_filenames: false
        always_run: false
        verbose: true

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=5m
        language: system
        types: [go]
        pass_filenames: false
      - id: markdownlint
        name: Markdownlint
        entry: markdownlint-cli2
        language: system
        files: \.(md|mdown|markdown)$

# Global settings
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false
